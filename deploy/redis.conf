# Redis configuration for datamonkey-js-server (issue #453).
#
# Bounds Redis memory growth as an operational safety net. This is the CANONICAL,
# declarative place to set the memory policy — it survives restarts and does not
# depend on the app being able to run CONFIG SET (managed Redis forbids that).
# The app also attempts a best-effort CONFIG SET of these at startup
# (lib/redis-client.js applyMemoryPolicy) for environments where shipping this
# file isn't possible, but a real deployment should mount this config.
#
# Usage:
#   redis-server /path/to/deploy/redis.conf
# or with docker-compose:
#   command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
#   volumes:
#     - ./deploy/redis.conf:/usr/local/etc/redis/redis.conf:ro

# --- Memory bound -----------------------------------------------------------
# Cap the dataset. Size this to your peak concurrent completed-result footprint
# plus headroom (job hashes embed the full result JSON until their TTL expires).
# Tune from the observed `used_memory` under load. 2gb is a starting point.
maxmemory 2gb

# --- Eviction policy (SAFETY-CRITICAL) --------------------------------------
# volatile-ttl: when at maxmemory, evict ONLY keys that carry a TTL, soonest
# expiry first. In this app TTLs are set EXCLUSIVELY on terminal (completed /
# error / aborted / cancelled) job hashes (see lib/redis-client.js
# expireCompleted / expireTerminal). Therefore eviction can only ever reclaim
# already-finished result blobs — never the live `active_jobs` list, never an
# in-flight job hash, never a running job's torque_id reverse-lookup hash (none
# of which carry a TTL).
#
# DO NOT change this to any allkeys-* policy: under memory pressure those could
# evict the active_jobs list or a live job/torque hash, which would silently
# break job status/cancel (a running cluster job would become un-cancellable
# because its scheduler id could no longer be resolved). noeviction is also
# unsafe here: at maxmemory it errors writes, which would fail a terminal hSet
# and zombie a job. volatile-ttl degrades gracefully by shedding old results.
maxmemory-policy volatile-ttl
